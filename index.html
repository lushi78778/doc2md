<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="doc2md 转换文档展示">
  <title>doc2md 文档</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
  <style>
    :root {
      --theme-color: #176b5b;
    }

    body {
      color: #252a2e;
    }

    .markdown-section {
      max-width: 920px;
      padding: 36px 48px;
    }

    .markdown-section p {
      line-height: 1.85;
    }

    .markdown-section img {
      display: block;
      max-height: 720px;
      margin: 1.5rem auto;
      object-fit: contain;
    }

    .sidebar {
      background: #f7f9f8;
    }

    @media (max-width: 768px) {
      .markdown-section {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="app">正在加载文档...</div>
  <script>
    window.$docsify = {
      name: 'doc2md',
      repo: 'lushi78778/doc2md',
      homepage: 'README.md',
      loadSidebar: true,
      relativePath: true,
      auto2top: true,
      subMaxLevel: 2,
      search: {
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 4
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-latex@0"></script>
</body>
</html>
